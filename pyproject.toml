[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-covenant-agent"
version = "0.1.0"
description = "Email-driven financial covenant verification agent for Stadtwerke Musterstadt GmbH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai>=1.40",
    "python-dotenv",
    "openpyxl",
    "pymupdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
finn = "finn.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
finn = ["texts/*.toml"]
